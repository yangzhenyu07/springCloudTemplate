server:
  port: 8089

spring:
  application:
    name: yzy-b-demo
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
    retry: # 重试配置
      max-attempts: 3
      delay: 1000 #重试间隔ms
    timeout: 3000 # 超时配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/YZY_DB?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: YZY_MASTER
    password: yzy@1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    my:
      flag: true
      host: 127.0.0.1
      port: 6379
      database: 2

mybatis-plus:
  # 生成器产出的 XML 放在 resources/mapper 下，显式声明避免自定义 SQL 时找不到 statement
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

test:
  message: "local-default-from-b-demo-yml"
