server:
  port: 8088
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto
    uri-encoding: UTF-8

spring:
  application:
    name: yzy-demo
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
    retry: # 重试配置
      max-attempts: 3
      delay: 1000 #重试间隔ms
    timeout: 3000 # 超时配置
    sentinel:
      eager: false
      transport:
        dashboard: ""
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/YZY_DB?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: YZY_MASTER
    password: yzy@1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    my:
      flag: true
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# RocketMQ 配置（生产者：交易中心顺序消息）
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    # 生产者组：事务回查/顺序消息发送时使用
    group: yzy-demo-trade-producer
    # 同步发送超时时间（ms）
    send-message-timeout: 3000

test:
  message: "local-default-from-yml"


