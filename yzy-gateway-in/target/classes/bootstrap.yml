server:
  port: 9000

spring:
  application:
    name: yzy-gateway-in
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
    retry: # 重试配置
      max-attempts: 3
      delay: 1000 #重试间隔ms
    timeout: 3000 # 超时配置
    gateway:
      routes:
        - id: yzy-b-demo-route
          uri: lb://yzy-b-demo
          predicates:
            - Path=/api/b/**
          filters:
            - StripPrefix=0
      discovery:
        locator:
          enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s

test:
  message: "local-default-gateway"


